# Wochenrhythmus und Bestellung

wochentage:                    # training = volle Portionen, leicht = kleinere Carb-Portionen
  Mo: training
  Di: training
  Mi: training
  Do: training
  Fr: training
  Sa: training
  So: training

spieltage: []                  # aktuell kein Basketball

bestellung:
  postleitzahl: "35039"        # Marburg – für Liefergebiet und Lieferslots
  liefertag: Mo                # Tag 0 des Wochenplans
  mindestbestellwert_eur: 70.0 # ab 70 € versandkostenfrei (darunter 5,49 € Versand) – Warenkorb wird bis dahin aufgefüllt
  max_lieferungen_pro_woche: 1 # keine Extra-Bestellung für Frisches
  zweite_lieferung_nach_tagen: 3
  verderbliches_vor_ort_kaufen: false # true = was bis zum Verbrauch nicht frisch bleibt, kommt auf eine "Vor Ort kaufen"-Liste
  bestaetigung_erforderlich: true
  # MyTime liefert am nächsten Tag (Bestellung bis 14 Uhr), sonst am übernächsten; Verspätungen kommen vor.
  # 2 Tage Vorlauf: Warenkorb morgens befüllt, vor 14 Uhr bestellt -> Lieferung einen Tag früher als nötig = Puffer.
  vorlauf_tage: 2              # so viele Tage vor dem Liefertermin wird der Warenkorb gefüllt
  reichweite_tage: 7           # eine Lieferung deckt so viele Tage
  # Hast du zu Hause – wird nicht bestellt. Sag dem Agenten Bescheid, wenn etwas leer wird.
  zu_hause: [olivenoel, passierte_tomaten]
