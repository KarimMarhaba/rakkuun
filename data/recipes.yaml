# Gerichte. Mengen in Gramm pro Portion.
# active_minutes  echte Handarbeit (Wartezeit zählt nicht)
# zero_prep       true = nichts schneiden, nichts vorbereiten
# variants        Abweichende Mengen je Tagestyp (z. B. leichte Tage)

# --- Standard aus Plan v6 --------------------------------------------------
oatmeal:
  name: Oatmeal mit Erdnussmus und Banane
  mahlzeit: fruehstueck
  active_minutes: 4
  zero_prep: true
  anleitung: >-
    Haferflocken + Milch in großer Schüssel 2 × 90 Sek. Mikrowelle (dazwischen rühren).
    Erdnussmus einrühren, Banane mit der Gabel reinquetschen.
  ingredients: {haferflocken: 100, h_vollmilch: 300, erdnussmus: 20, banane: 120}

nudeln_tomate_huelsen:
  name: Nudeln mit Tomatensauce und Hülsenfrüchten
  mahlzeit: mittag
  active_minutes: 3
  zero_prep: true
  anleitung: >-
    1) Wasser im Wasserkocher kochen, in den Topf, salzen, Nudeln rein (ca. 10 Min).
    2) Hülsenfrüchte abtropfen und die letzten 2 Minuten mit in den Topf.
    3) Abgießen, dann passierte Tomaten, einen großzügigen Schuss Kochcreme (kein Abwiegen),
    1,5 EL Olivenöl, Jodsalz und Gewürze direkt in den Topf, umrühren, 1 Minute warm werden lassen.
  ingredients: {nudeln: 200, passierte_tomaten: 200, kichererbsen: 125, olivenoel: 15, kochcreme: 40}
  variants:
    leicht: {nudeln: 150}

reis_bowl:
  name: Reiskocher-Bowl mit TK-Gemüse
  mahlzeit: abend
  active_minutes: 2
  zero_prep: true
  anleitung: >-
    Reis + TK-Gemüse (60 % Erbsen & Möhren, 30 % Erbsen, 10 % Brokkoli/Spinat) + Wasser + Gewürze in den
    Reiskocher. 1,5 EL Öl erst über die fertige Bowl.
  ingredients: {basmatireis: 100, tk_erbsen: 90, tk_gemuese_mix: 180, tk_brokkoli: 30, olivenoel: 15}
  variants:
    leicht: {basmatireis: 75}

fleisch_gyros:
  name: Hähnchengyros aus der Heißluftfritteuse
  mahlzeit: abend
  active_minutes: 1
  zero_prep: true
  anleitung: Gefroren in die Heißluftfritteuse, ca. 18 Min.
  ingredients: {haehnchengyros_tk: 120}

fleisch_brust:
  name: Hähnchenbrust natur aus der Heißluftfritteuse
  mahlzeit: abend
  active_minutes: 1
  zero_prep: true
  anleitung: Gefroren in die Heißluftfritteuse, ca. 18 Min, selbst würzen.
  ingredients: {haehnchenbrust_tk: 120}

joghurt_snack:
  name: Griechischer Joghurt mit Müsli, Leinsamen und Beeren
  mahlzeit: snack
  active_minutes: 1
  zero_prep: true
  anleitung: Alles in eine Schüssel, 5 g Kreatin einrühren.
  ingredients: {griech_joghurt_10: 200, muesli: 50, leinsamen: 10, tk_beeren: 100}

skyr_walnuss_snack:
  name: Skyr mit Walnüssen, Leinsamen und Beeren
  mahlzeit: snack
  active_minutes: 1
  zero_prep: true
  anleitung: Skyr in eine Schüssel, Beeren (gefroren oder angetaut), Walnüsse und Leinsamen drüber, 5 g Kreatin einrühren.
  ingredients: {skyr: 300, walnuesse: 40, leinsamen: 10, tk_beeren: 150}

clementinen_obst:
  name: 2 Clementinen zwischendurch
  mahlzeit: extra
  active_minutes: 0
  zero_prep: true
  anleitung: Schälen und essen – z. B. am Nachmittag oder nach dem Training.
  ingredients: {clementinen: 100}

rote_bete_shot:
  name: Rote-Bete-Saft (2–3 h vor Spiel/Pickup)
  mahlzeit: extra
  active_minutes: 0
  zero_prep: true
  ingredients: {rote_bete_saft: 200}

# --- Optionale Extras ------------------------------------------------------
kerne_topping:
  name: Kürbiskerne über die Bowl
  mahlzeit: extra
  active_minutes: 0
  zero_prep: true
  ingredients: {kuerbiskerne: 20}

makrele:
  name: Makrele/Sardinen direkt aus der Dose (EPA/DHA)
