# Gerichte. Mengen in Gramm pro Portion.
# active_minutes  echte Handarbeit (Wartezeit zählt nicht)
# zero_prep       true = nichts schneiden, nichts vorbereiten
# variants        Abweichende Mengen je Tagestyp (z. B. leichte Tage)

# --- Standard aus Plan v6 --------------------------------------------------
spiegelei_brot:
  name: Spiegeleier mit Vollkornbrot und Banane
  mahlzeit: fruehstueck
  active_minutes: 6
  zero_prep: true
  anleitung: >-
    1 EL Öl in die Pfanne, 3 Eier aufschlagen, bei mittlerer Hitze ca. 4 Min braten (Deckel drauf,
    dann wird das Eigelb schneller fest), salzen. Dazu 4 Scheiben Vollkornbrot (aus dem Tiefkühler
    direkt in den Toaster), eine Scheibe Käse drauf, und eine Banane.
  ingredients: {eier: 165, olivenoel: 10, vollkornbrot: 200, gouda: 20, banane: 120}

oatmeal:
  name: Schoko-Oatmeal mit Banane, Erdnussmus und Zimt
  mahlzeit: fruehstueck
  active_minutes: 4
  zero_prep: true
  anleitung: >-
    Banane in einer großen Schüssel mit der Gabel zerdrücken, Haferflocken, Milch, 1 EL Kakao,
    Zimt und eine Prise Salz dazu, 2 × 90 Sek. Mikrowelle (dazwischen rühren) – gekocht wird die
    Banane deutlich süßer. Dann 1 TL Agavendicksaft und das Erdnussmus einrühren.
  ingredients: {haferflocken: 100, h_vollmilch: 300, erdnussmus: 20, banane: 120, agavendicksaft: 10, backkakao: 10}

nudeln_tomate_huelsen:
  name: Nudeln mit Tomatensauce und Hülsenfrüchten
  mahlzeit: mittag
  active_minutes: 3
  zero_prep: true
  anleitung: >-
    1) Wasser im Wasserkocher kochen, in den Topf, salzen, Nudeln rein (ca. 10 Min).
    2) Hülsenfrüchte abtropfen und die letzten 2 Minuten mit in den Topf.
    3) Abgießen, dann passierte Tomaten, einen großzügigen Schuss Kochcreme (kein Abwiegen),
    1,5 EL Olivenöl, Jodsalz und Gewürze direkt in den Topf, umrühren, 1 Minute warm werden lassen.
  ingredients: {nudeln: 250, passierte_tomaten: 200, kichererbsen: 125, olivenoel: 15, kochcreme: 40}
  variants:
    leicht: {nudeln: 150}

reis_bowl:
  name: Reiskocher-Bowl mit TK-Gemüse
  mahlzeit: abend
  active_minutes: 2
  zero_prep: true
  anleitung: >-
    75 g Reis + TK-Gemüse (250 g Erbsen & Möhren, 50 g Brokkoli) + Wasser + Gewürze in den
    Reiskocher. 1,5 EL Öl erst über die fertige Bowl.
  ingredients: {basmatireis: 75, tk_gemuese_mix: 250, tk_brokkoli: 50, olivenoel: 15}
  variants:
    leicht: {basmatireis: 75}

fleisch_gyros:
  name: Hähnchengyros aus der Heißluftfritteuse
  mahlzeit: abend
  active_minutes: 1
  zero_prep: true
  anleitung: Gefroren in die Heißluftfritteuse, ca. 18 Min.
  ingredients: {haehnchengyros_tk: 120}

fleisch_brust:
  name: Hähnchenbrust natur aus der Heißluftfritteuse
  mahlzeit: abend
  active_minutes: 1
  zero_prep: true
  anleitung: Gefroren in die Heißluftfritteuse, ca. 18 Min, selbst würzen.
  ingredients: {haehnchenbrust_tk: 120}

joghurt_snack:
  name: Griechischer Joghurt mit Müsli, Leinsamen und Beeren
  mahlzeit: snack
  active_minutes: 1
  zero_prep: true
  anleitung: Alles in eine Schüssel, 5 g Kreatin einrühren.
  ingredients: {griech_joghurt_10: 200, muesli: 50, leinsamen: 10, tk_beeren: 100}

skyr_walnuss_snack:
  name: Skyr mit Walnüssen, Leinsamen und Beeren
  mahlzeit: snack
  active_minutes: 1
  zero_prep: true
  anleitung: Skyr in eine Schüssel, Beeren (gefroren oder angetaut), Walnüsse und Leinsamen drüber, 5 g Kreatin einrühren.
  ingredients: {skyr: 400, walnuesse: 25, leinsamen: 10, tk_beeren: 150}

clementinen_obst:
  name: 2 Clementinen zwischendurch
  mahlzeit: extra
  active_minutes: 0
  zero_prep: true
  anleitung: Schälen und essen – z. B. am Nachmittag oder nach dem Training.
  ingredients: {clementinen: 100}

rote_bete_shot:
  name: Rote-Bete-Saft (2–3 h vor Spiel/Pickup)
  mahlzeit: extra
  active_minutes: 0
  zero_prep: true
  ingredients: {rote_bete_saft: 200}

