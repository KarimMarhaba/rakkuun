# Aus dieser Vorlage wird jede Woche automatisch ein Plan erzeugt.
# Du (bzw. der Agent auf deinen Wunsch) darfst sie frei ändern – die Grundregeln
# in regeln.yaml werden trotzdem immer geprüft.

mahlzeiten: [oatmeal, nudeln_tomate_huelsen, reis_bowl, skyr_walnuss_snack, clementinen_obst]

# Fleisch zur Bowl: Anzahl Tage pro Woche. Jeden Tag gleich -> nur eine Sorte mit 7 Tagen.
# (Gyros max. 4×/Woche wegen Salz – deshalb täglich Hähnchenbrust natur.)
fleisch:
  fleisch_brust: 7

# Hülsenfrucht im Mittagessen wechselt von Woche zu Woche (innerhalb der Woche gleich)
huelsenfrucht_rotation: [kichererbsen, kidneybohnen, weisse_bohnen, linsen]

# Zusätzlich an Spieltagen (nur relevant, wenn in einstellungen.yaml spieltage gesetzt sind)
spieltag_extras: [rote_bete_shot]

# Zusätzlich 1× pro Woche (leer lassen, solange die Omega-3-Kapseln EPA/DHA enthalten)
woechentliche_extras: []
