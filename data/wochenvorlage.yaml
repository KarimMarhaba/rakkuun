# Aus dieser Vorlage wird jede Woche automatisch ein Plan erzeugt.
# Du (bzw. der Agent auf deinen Wunsch) darfst sie frei ändern – die Grundregeln
# in regeln.yaml werden trotzdem immer geprüft.

mahlzeiten: [oatmeal, nudeln_tomate_huelsen, reis_bowl, joghurt_snack]

# Fleisch zur Bowl: Anzahl Tage pro Woche. Gyros bevorzugt an Spieltagen (Salz ist dort ein Vorteil).
fleisch:
  fleisch_gyros: 4
  fleisch_brust: 3

# Hülsenfrucht im Mittagessen wechselt wöchentlich
huelsenfrucht_rotation: [kichererbsen, kidneybohnen, weisse_bohnen, linsen]

# Zusätzlich an Spieltagen (Pickup/Spiel)
spieltag_extras: [rote_bete_shot]

# Zusätzlich 1× pro Woche (leer lassen, solange die Omega-3-Kapseln EPA/DHA enthalten)
woechentliche_extras: []
