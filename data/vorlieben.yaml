# Deine Vorlieben – hier trägt der Agent ein, was du ihm im Gespräch sagst.
# Vorlieben werden immer umgesetzt, SOLANGE die Grundregeln (regeln.yaml) eingehalten bleiben.

jeden_tag_gleich: true   # jeder Wochentag identisch; Abwechslung nur von Woche zu Woche
abneigungen: [proteinpulver]  # Zutat-IDs, die nie im Plan landen dürfen
tausch: {}               # dauerhafte 1:1-Ersetzungen, z. B. {tk_brokkoli: tk_spinat}
