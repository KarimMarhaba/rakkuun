# PLATZHALTER – wird mit den Werten aus deinem bestehenden Ernährungsplan ersetzt.

daily_targets:
  kcal: 2800            # Zielwert, Toleranz siehe unten
  protein: 170          # Mindestwert in g
  carbs: 330            # Richtwert in g
  fat: 80               # Richtwert in g
  fiber: 30             # Mindestwert in g
  calcium_mg: 1000      # DGE-Referenzwert Erwachsene
  iron_mg: 10
  magnesium_mg: 350

# Welche Ziele Mindestwerte sind (alles andere wird mit Toleranz geprüft)
minimum_targets: [protein, fiber, calcium_mg, iron_mg, magnesium_mg]
tolerance_pct: 10

ordering:
  min_order_eur: 70.0       # Mindestbestellwert MyTime
  max_deliveries_per_week: 2
  second_delivery_day: 3    # 0 = Tag der ersten Lieferung
  require_confirmation: true
